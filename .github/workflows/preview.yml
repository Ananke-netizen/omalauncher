name: preview

# Builds an APK signed with this fork's key for a change waiting on review, without releasing
# it: a push to a polish/** branch (or a run started by hand) leaves the APK and its SHA256SUMS
# as the run's artifact, so it can be installed over a release and tested before merging.
# Releases still come only from v* tags (release.yml).
on:
  push:
    branches: ['polish/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the app version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # As release.yml: fetch-proot.sh builds proot with the NDK it pins, installed if the image lacks it.
      - name: Fetch proot
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
          scripts/fetch-proot.sh

      # The same key as releases, so a preview installs over a release and the next release over it.
      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The KEYSTORE_* secrets aren't set; the APK would be debug-signed" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Test
        run: ./gradlew :owl:test :app:testDebugUnitTest

      - name: Build
        run: ./gradlew :app:assembleRelease

      - name: Checksum
        id: apk
        run: |
          apk="omalauncher-${{ steps.version.outputs.name }}-preview-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > SHA256SUMS
          echo "file=$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: omalauncher-preview-${{ github.sha }}
          path: |
            ${{ steps.apk.outputs.file }}
            SHA256SUMS
          retention-days: 30
