<!doctype html>
<!--
  This fork's README screenshots of the feed, framed like upstream's Play screenshots
  (store/screenshots/frame.html). Rendered one slide at a time by render.sh (frame.html?s=N)
  from the captures in raw/, taken on the emulator with Android's demo mode status bar.
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #16161e; }
  .slide { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'JetBrains Mono', monospace; }
  .backdrop { position: absolute; inset: -120px; background-size: cover; background-position: center; filter: blur(70px) saturate(1.3) brightness(0.42); transform: scale(1.1); }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,16,0.82) 0%, rgba(10,10,16,0.35) 32%, rgba(10,10,16,0.15) 100%); }
  .glow { position: absolute; inset: 0; background:
      radial-gradient(ellipse 620px 760px at 30% 72%, rgba(51,204,255,0.20), transparent 70%),
      radial-gradient(ellipse 620px 760px at 72% 60%, rgba(187,154,247,0.22), transparent 70%); }
  .caption { position: absolute; top: 112px; left: 80px; right: 80px; color: #c0caf5; }
  .caption h1 { font-size: 76px; font-weight: 800; line-height: 1.08; letter-spacing: -2px; color: #fff; }
  .caption h1 em { font-style: normal; background: linear-gradient(90deg, #33ccff, #00ff99); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .caption p { margin-top: 26px; font-size: 34px; line-height: 1.4; color: rgba(220, 228, 255, 0.78); }
  .prompt { font-size: 30px; color: #33ccff; margin-bottom: 22px; letter-spacing: 1px; }
  .phone { position: absolute; left: 50%; border-radius: 64px; padding: 14px; background: #0c0c12;
           box-shadow: 0 0 0 2px rgba(255,255,255,0.10), 0 50px 120px rgba(0,0,0,0.65); }
  .phone img { display: block; width: 100%; border-radius: 50px; }
  .single .phone { top: 440px; width: 610px; transform: translateX(-50%); }
  .trio .phone { top: 620px; width: 500px; }
  .trio .p1 { transform: translateX(-118%) rotate(-7deg); top: 690px; }
  .trio .p3 { transform: translateX(18%) rotate(7deg); top: 690px; }
  .trio .p2 { transform: translateX(-50%); z-index: 2; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const SLIDES = [
  { shot: 'feed_tokyo', title: 'The <em>feed</em>', text: 'Swipe right on home for Hacker News, X and tech and news headlines.' },
  { shot: 'feed_settings', title: 'Your <em>sources</em>', text: 'Pick the sites and X accounts, mute words, set how often it refreshes.' },
  { trio: ['feed_white_hn', 'feed_tokyo_tech', 'feed_vantablack'], bg: 'feed_tokyo_tech', title: 'In <em>every theme</em>', text: 'It takes the theme\'s colors, light or dark, like the rest of home.' },
];
const n = +(new URLSearchParams(location.search).get('s') || 1);
const s = SLIDES[n - 1];
const img = name => `raw/${name}.png`;
const phones = s.trio
  ? s.trio.map((t, i) => `<div class="phone p${i + 1}"><img src="${img(t)}"></div>`).join('')
  : `<div class="phone"><img src="${img(s.shot)}"></div>`;
document.getElementById('root').innerHTML = `
  <div class="slide ${s.trio ? 'trio' : 'single'}">
    <div class="backdrop" style="background-image:url(${img(s.bg || s.shot)})"></div>
    <div class="shade"></div>
    <div class="glow"></div>
    <div class="caption"><div class="prompt">~ ›</div><h1>${s.title}</h1><p>${s.text}</p></div>
    ${phones}
  </div>`;
document.title = String(SLIDES.length);
</script>
</body>
</html>
